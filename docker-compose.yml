services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 5
    redis:
        image: redis:7-alpine
        command: >
            redis-server
            --save ""
            --appendonly no
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
    api:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__WalletDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            ConnectionStrings__Redis: "redis:6379"
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
    worker:
        build:
            context: .
            dockerfile: Dockerfile.worker
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__WalletDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
            ConnectionStrings__Redis: "redis:6379"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
volumes:
    postgres-data:

